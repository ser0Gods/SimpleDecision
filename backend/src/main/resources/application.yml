spring:
  jpa:
    hibernate:
      ddl-auto: update
    generate-ddl: true
    open-in-view: false
  datasource:
    url: jdbc:h2:file:./data/decisiondb;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ''
    hikari:
      minimum-idle: 5
      maximum-pool-size: 5
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080
